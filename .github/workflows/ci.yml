name: CI
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 테스트 명세 잠금
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          FIRST=$(git rev-list ${BASE}..HEAD | tail -1)
          CHANGED=$(git diff --name-only ${FIRST}..HEAD -- 'tests/')
          if [ -n "$CHANGED" ]; then
            echo "::error::첫 커밋 이후 테스트가 수정됨"
            echo "$CHANGED"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm test
