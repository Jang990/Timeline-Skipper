name: CI
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 잠글 것은 단언이지 장치가 아니다. tests/fixtures/까지 잠그면 구현 커밋이
      # 자기가 쓰는 픽스처를 못 고쳐서 "테스트 먼저 → 구현" 순서가 성립하지 않는다.
      - name: 테스트 명세 잠금
        run: |
          BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          FIRST=$(git rev-list ${BASE}..HEAD | tail -1)
          CHANGED=$(git diff --name-only ${FIRST}..HEAD -- tests/ ':(exclude)tests/fixtures/')
          if [ -n "$CHANGED" ]; then
            echo "::error::첫 커밋 이후 테스트가 수정됨"
            echo "$CHANGED"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Playwright 버전 읽기
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # 브라우저는 Playwright 버전에만 매인다. 버전을 올리면 키가 달라져 알아서 새로 받는다.
      - name: 크로미움 캐시
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # 확장은 크로미움에서만 돈다. firefox와 webkit까지 받으면 캐시만 뚱뚱해진다.
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # 캐시에 들어가는 건 브라우저뿐이다. apt로 깔리는 OS 라이브러리는 매번 다시 깔아야 한다.
      # 이 분기를 빼면 "캐시는 맞았는데 브라우저가 안 뜬다"가 된다.
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      # 재시도를 켜지 않았으므로, 깨진 이유는 여기 남는 것으로만 좇을 수 있다.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
