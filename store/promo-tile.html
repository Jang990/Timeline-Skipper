<style>*{margin:0;box-sizing:border-box}body{width:440px;height:280px;overflow:hidden;font-family:"Malgun Gothic",sans-serif;color:#fff} body{background:#0f1729;display:flex;align-items:center;padding:0 30px;gap:26px}
.text h1{font:700 30px/1.1 "Segoe UI",sans-serif}.text p{margin-top:12px;font-size:15px;line-height:1.5;color:#c7d2e6}
.list{background:#1c2740;border-radius:14px;padding:14px 16px;width:190px;flex:none;position:relative}
.row{display:flex;align-items:center;gap:9px;font-size:13px;height:30px}
.box{width:16px;height:16px;border-radius:4px;background:#3d8bff;display:grid;place-items:center;font-size:11px}
.off{opacity:.4}.off .box{background:none;border:2px solid #8a97b0}.off span{text-decoration:line-through}
.t{color:#8fb6ff;font-variant-numeric:tabular-nums}
svg.jump{position:absolute;right:-18px;top:24px}</style>

<div class="row"><div class="box">✓</div><span class="t">12:05</span><span>Ballerino</span></div>
<div class="row"><div class="box">✓</div><span class="t">16:30</span><span>Encore</span></div>

</div><div class="text"><h1>Timeline<br>Skipper</h1><p>타임라인 댓글로<br>트랙 목록을 만들고<br>원하는 구간만 재생</p></div></body>
